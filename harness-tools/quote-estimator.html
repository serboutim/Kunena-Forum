<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wire Harness Quote &amp; Cost Estimator</title>
<meta name="description" content="Estimate harness material and labor cost from a BOM and operation counts, with quantity breaks and a printable quote.">
<style>
:root{--bg:#0f1419;--panel:#172029;--line:#2a3743;--text:#e6edf3;--mut:#8b9bab;--acc:#f59e0b;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}header a{color:var(--mut);text-decoration:none}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 12px}main{max-width:1250px;margin:0 auto;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;background:#0b1015;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}
button{background:var(--acc);color:#111;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}button.sec{background:#2a3743;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:900px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
td.n,th.n{text-align:right}td input{padding:4px}.x{background:transparent;color:var(--bad);padding:2px 8px}.note{font-size:12px;color:var(--mut)}
#quote{background:#fff;color:#111;border-radius:10px;padding:32px}#quote table th{color:#555}#quote td,#quote th{border-color:#ddd}
#quote h2{font-size:22px;margin:0}.qh{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px}
@media print{header,.noprint{display:none!important}body{background:#fff}main{padding:0}#quote{padding:0}}
</style>
</head>
<body>
<header><a href="index.html">&larr; Harness Tools</a><h1>Harness Quote &amp; Cost Estimator</h1></header>
<main>
<div class="noprint">
<div class="card"><h2>Quote details</h2><div class="grid">
  <div><label>Your company</label><input id="co" value="Acme Harness Co."></div>
  <div><label>Customer</label><input id="cust" value="Customer Inc."></div>
  <div><label>Harness P/N &amp; rev</label><input id="pn" value="HX-1001 Rev A"></div>
  <div><label>Quote #</label><input id="qn" value="Q-0001"></div>
  <div><label>Valid (days)</label><input id="valid" type="number" value="30"></div>
  <div><label>Currency</label><select id="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>CNY</option><option>MXN</option></select></div>
  <div><label>Quantity breaks</label><input id="qty" value="1, 10, 100, 500, 1000"></div>
</div></div>
<div class="two">
<div class="card"><h2>Operations per harness</h2><table><thead><tr><th>Operation</th><th class="n">Count / unit</th><th class="n">Std time (s)</th></tr></thead><tbody id="ops"></tbody></table>
<div class="grid" style="margin-top:12px"><div><label>Crimp method</label><select id="crimp"><option value="22">Hand tool (22 s)</option><option value="8" selected>Bench press + applicator (8 s)</option><option value="3">Automatic cut/strip/crimp (3 s)</option></select></div>
<div><label>Setup per lot (min)</label><input id="setup" type="number" value="45"></div><div><label>Learning curve (%)</label><input id="lc" type="number" value="90" title="Applies to lots under 100 units"></div></div></div>
<div class="card"><h2>Materials per harness</h2><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Unit cost</th><th class="n">Ext</th><th></th></tr></thead><tbody id="mat"></tbody></table>
<div style="margin-top:8px;display:flex;gap:8px"><button class="sec" id="addM">+ Add item</button><button class="sec" id="pasteM">Paste CSV (item,qty,cost)</button></div></div>
</div>
<div class="card"><h2>Rates &amp; margins</h2><div class="grid">
  <div><label>Labor rate / hr</label><input id="rate" type="number" value="28"></div>
  <div><label>Labor overhead %</label><input id="oh" type="number" value="60"></div>
  <div><label>Material markup %</label><input id="mk" type="number" value="15"></div>
  <div><label>Scrap / attrition %</label><input id="scrap" type="number" value="3"></div>
  <div><label>Target margin %</label><input id="mg" type="number" value="25"></div>
  <div><label>One-time NRE / tooling</label><input id="nre" type="number" value="350"></div>
  <div><label>NRE handling</label><select id="nreMode"><option value="sep">Separate line item</option><option value="amort">Spread across first lot</option></select></div>
</div><div style="margin-top:12px;display:flex;gap:8px"><button id="save">Save to browser</button><button class="sec" id="load">Load saved</button><button class="sec" onclick="window.print()">Print / PDF quote</button></div></div>
</div>
<div id="quote"></div>
</main>
<script>
const OPS=[["Cut wire","wires",14,6],["Strip wire end","ends",28,5],["Crimp terminal","crimps",26,null],["Insert terminal into housing","inserts",26,6],["Install wire seal","seals",10,8],["Splice (ultrasonic or crimp)","splices",2,60],["Heat shrink (place + shrink)","shrink",4,45],["Apply label / marker","labels",6,15],["Tape wrap (per meter)","tape",1.5,60],["Convoluted loom / sleeve (per meter)","loom",1,40],["Install connector backshell / clip","clips",3,20],["Layout on formboard (per branch)","branches",4,30],["Continuity test (per circuit)","test",14,4],["Visual inspection &amp; pack","pack",1,90]];
let MAT=[["Wire 20 AWG TXL (m)",18,0.22],["Connector housing DT06-4S",2,1.9],["Connector housing DT04-4P",1,2.1],["Contacts size 16",14,0.32],["Wedge lock",3,0.25],["Heat shrink (pc)",4,0.12],["Labels",6,0.05],["Tape (m)",1.5,0.18]];
const $=id=>document.getElementById(id);let opCount=OPS.map(o=>o[2]),opTime=OPS.map(o=>o[3]);
function drawOps(){$('ops').innerHTML=OPS.map((o,i)=>`<tr><td>${o[0]}</td><td class=n><input type=number step=0.5 data-c=${i} value="${opCount[i]}" style="width:80px"></td><td class=n>${o[3]===null?`<span class=note>per crimp method</span>`:`<input type=number data-t=${i} value="${opTime[i]}" style="width:70px">`}</td></tr>`).join('')}
function drawMat(){$('mat').innerHTML=MAT.map((m,i)=>`<tr><td><input data-m=${i} data-k=0 value="${m[0].replace(/"/g,'&quot;')}"></td><td class=n><input type=number step=0.1 data-m=${i} data-k=1 value="${m[1]}" style="width:70px"></td><td class=n><input type=number step=0.01 data-m=${i} data-k=2 value="${m[2]}" style="width:80px"></td><td class=n>${(m[1]*m[2]).toFixed(2)}</td><td><button class=x data-d=${i}>&times;</button></td></tr>`).join('')}
$('ops').oninput=e=>{const d=e.target.dataset;if(d.c!=null)opCount[d.c]=+e.target.value;if(d.t!=null)opTime[d.t]=+e.target.value;calc()};
$('mat').onchange=e=>{const d=e.target.dataset;if(d.m==null)return;MAT[d.m][d.k]=d.k==0?e.target.value:+e.target.value;drawMat();calc()};
$('mat').onclick=e=>{if(e.target.dataset.d!=null){MAT.splice(+e.target.dataset.d,1);drawMat();calc()}};
$('addM').onclick=()=>{MAT.push(["New item",1,0]);drawMat()};
$('pasteM').onclick=()=>{const t=prompt('Paste CSV rows: item,qty,unit_cost');if(!t)return;t.trim().split(/\n/).forEach(l=>{const p=l.split(/[,\t;]/);if(p.length>=3&&!isNaN(+p[1]))MAT.push([p[0].trim(),+p[1],+p[2]])});drawMat();calc()};
document.querySelectorAll('.card input,.card select').forEach(e=>{if(!e.closest('#ops')&&!e.closest('#mat'))e.addEventListener('input',calc)});
const money=(v,c)=>new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(v);
function calc(){
  const cur=$('cur').value,crimpT=+$('crimp').value,rate=+$('rate').value,oh=+$('oh').value/100,mk=+$('mk').value/100,scrap=+$('scrap').value/100,mg=Math.min(+$('mg').value,95)/100;
  const setup=+$('setup').value,lc=Math.min(+$('lc').value||100,100)/100,b=Math.log2(lc),nre=+$('nre').value||0,nreMode=$('nreMode').value;
  const sec=OPS.reduce((s,o,i)=>s+opCount[i]*(o[3]===null?crimpT:opTime[i]),0);
  const mat=MAT.reduce((s,m)=>s+m[1]*m[2],0)*(1+scrap)*(1+mk);
  const qtys=$('qty').value.split(/[,\s]+/).map(Number).filter(q=>q>0);
  const rows=qtys.map(q=>{const lf=Math.max(1,Math.pow(q/100,b));const lab=sec*lf/3600*rate*(1+oh);const set=setup/60*rate*(1+oh)/q;
    const n=nreMode==='amort'?nre/q:0;const cost=lab+mat+set+n;const price=cost/(1-mg);return{q,lf,lab,mat,set,n,cost,price,ext:price*q}});
  const today=new Date(),exp=new Date(today.getTime()+(+$('valid').value)*864e5);
  const opsRows=OPS.map((o,i)=>({n:o[0],c:opCount[i],t:o[3]===null?crimpT:opTime[i]})).filter(o=>o.c>0);
  $('quote').innerHTML=`<div class=qh><div><h2>${esc($('co').value)}</h2><div>Quotation</div></div><div style="text-align:right"><b>${esc($('qn').value)}</b><br>Date: ${today.toLocaleDateString()}<br>Valid until: ${exp.toLocaleDateString()}</div></div>
  <p><b>Customer:</b> ${esc($('cust').value)}<br><b>Item:</b> Wire harness assembly ${esc($('pn').value)}</p>
  <table><thead><tr><th>Quantity</th><th class=n>Unit price</th><th class=n>Extended</th><th class=n>Labor / unit</th><th class=n>Material / unit</th><th class=n>Setup / unit</th><th class=n>Margin</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.q}</td><td class=n><b>${money(r.price,cur)}</b></td><td class=n>${money(r.ext,cur)}</td><td class=n>${money(r.lab,cur)}</td><td class=n>${money(r.mat,cur)}</td><td class=n>${money(r.set+r.n,cur)}</td><td class=n>${money(r.price-r.cost,cur)}</td></tr>`).join('')}
  ${nre&&nreMode==='sep'?`<tr><td>One-time NRE / tooling / first article</td><td class=n>${money(nre,cur)}</td><td class=n>${money(nre,cur)}</td><td colspan=4></td></tr>`:''}</tbody></table>
  <p style="font-size:12px;color:#555;margin-top:18px">Standard labor content is ${(sec/60).toFixed(1)} minutes per harness (${opsRows.length} operations); lots under 100 units carry a learning-curve allowance. Material includes ${Math.round(scrap*100)}% attrition. Prices exclude tax and freight. Lead time is subject to material availability.</p>
  <details class=noprint style="color:#333"><summary>Labor breakdown</summary><table>${opsRows.map(o=>`<tr><td>${o.n}</td><td class=n>${o.c} &times; ${o.t}s</td><td class=n>${(o.c*o.t/60).toFixed(2)} min</td></tr>`).join('')}</table></details>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FIELDS=['co','cust','pn','qn','valid','cur','qty','crimp','setup','lc','rate','oh','mk','scrap','mg','nre','nreMode'];
$('save').onclick=()=>{localStorage.setItem('hqe',JSON.stringify({f:Object.fromEntries(FIELDS.map(k=>[k,$(k).value])),opCount,opTime,MAT}));alert('Saved in this browser.')};
$('load').onclick=()=>{const s=JSON.parse(localStorage.getItem('hqe')||'null');if(!s)return alert('Nothing saved yet.');FIELDS.forEach(k=>$(k).value=s.f[k]);opCount=s.opCount;opTime=s.opTime;MAT=s.MAT;drawOps();drawMat();calc()};
drawOps();drawMat();calc();
</script>
</body>
</html>
